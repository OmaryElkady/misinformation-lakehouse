version: "3.9"

# ─── Shared network ───────────────────────────────────────────────────────────
networks:
  lakehouse-net:
    driver: bridge

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  mlflow-data:
  mlflow-db-data:
  delta-data:
  prefect-data:

services:

  # ── MLflow Tracking Server ──────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    working_dir: /mlflow
    restart: unless-stopped
    volumes:
      - mlflow-data:/mlflow/mlruns
      - mlflow-db-data:/mlflow/db
    ports:
      - "5000:5000"
    networks:
      - lakehouse-net
    environment:
      MLFLOW_HOST: "0.0.0.0"
      MLFLOW_GUNICORN_OPTS: "--timeout 120"
      GUNICORN_CMD_ARGS: "--timeout 120"
    command: >
      bash -c "pip install 'mlflow>=3.0.0,<4.0.0' --quiet &&
               python -m mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri sqlite:////mlflow/db/mlflow.db
               --default-artifact-root /mlflow/mlruns
               --extra-allowed-hosts mlflow:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── Prefect Server ─────────────────────────────────────────────────────────
  prefect:
    image: prefecthq/prefect:3-python3.12
    container_name: prefect-server
    volumes:
      - prefect-data:/root/.prefect
    ports:
      - "4200:4200"
    networks:
      - lakehouse-net
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: "sqlite+aiosqlite:////root/.prefect/prefect.db?timeout=30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── FastAPI Serving ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/serving/Dockerfile
    container_name: misinfo-api
    ports:
      - "8000:8000"
    networks:
      - lakehouse-net
    volumes:
      - mlflow-data:/mlflow/mlruns        # access model artifacts
      - delta-data:/data/delta            # access Gold table for feature lookup
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Prefect Worker (runs flows) ────────────────────────────────────────────
  prefect-worker:
    image: prefecthq/prefect:3-python3.12
    container_name: prefect-worker
    working_dir: /app
    volumes:
      - .:/app
      - delta-data:/data/delta
    networks:
      - lakehouse-net
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: prefect worker start --pool default-agent-pool
    depends_on:
      prefect:
        condition: service_healthy
