name: CI Pipeline

on:
  push:
    branches: [main, develop, production]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  # CI uses local storage — no AWS credentials needed for unit tests
  STORAGE_MODE: local
  LOCAL_DELTA_PATH: ./data/delta
  MLFLOW_TRACKING_URI: http://localhost:5000
  MLFLOW_EXPERIMENT_NAME: misinformation-detection-ci

jobs:
  # ── 1. Lint & Format ────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff==0.4.7 black==24.4.2

      - name: Run Ruff (linter)
        run: ruff check src/ tests/

      - name: Run Black (format check)
        run: black --check src/ tests/

  # ── 2. Unit Tests ───────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install only what unit tests need (fast — no PySpark/torch)
          pip install \
            fastapi==0.111.0 \
            uvicorn==0.30.1 \
            pydantic==2.7.1 \
            pydantic-settings==2.3.0 \
            python-dotenv==1.0.1 \
            httpx==0.27.0 \
            pytest==8.2.2 \
            pytest-cov==5.0.0 \
            pytest-asyncio==0.23.7 \
            loguru==0.7.2 \
            numpy==1.26.4 \
            scikit-learn==1.5.0 \
            pandas==2.2.2 \
            groq==0.9.0

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -m unit \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── 3. Docker Build Check ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: |
          docker build \
            -f src/serving/Dockerfile \
            -t misinfo-api:ci-${{ github.sha }} \
            .

      - name: Smoke test container health endpoint
        run: |
          docker run -d \
            --name misinfo-api-test \
            -p 8000:8000 \
            -e STORAGE_MODE=local \
            -e MLFLOW_TRACKING_URI=http://localhost:5000 \
            misinfo-api:ci-${{ github.sha }}

          # Poll until /health returns 200 (up to 60 s)
          for i in $(seq 1 12); do
            curl -sf http://localhost:8000/health && break
            [ $i -lt 12 ] || { docker logs misinfo-api-test; exit 1; }
            sleep 5
          done

          docker stop misinfo-api-test

  # ── 4. S3 Connectivity Check (runs on production branch only) ──────────────
  s3-connectivity:
    name: S3 Connectivity Check
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/production'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      STORAGE_MODE: s3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            boto3==1.34.120 \
            rich==13.7.1 \
            pydantic-settings==2.3.0 \
            python-dotenv==1.0.1 \
            loguru==0.7.2

      - name: Verify S3 connectivity
        run: PYTHONPATH=. python scripts/verify_s3.py

  # ── 5. Model Validation Gate (runs on main only) ────────────────────────────
  # Checks that a registered MLflow model meets quality thresholds before any
  # merge to main. Skipped if no model is registered yet.
  model-validation:
    name: Model Validation Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install MLflow
        run: pip install mlflow==2.13.0 pydantic-settings==2.3.0 python-dotenv==1.0.1

      - name: Run model validation script
        run: python scripts/validate_model.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        continue-on-error: true   # Won't block until a model is registered
